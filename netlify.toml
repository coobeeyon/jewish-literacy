# Every view is a prebuilt page in dist/ (e.g. /weekday/shacharit is weekday/shacharit.html), so
# Netlify serves the slashless URLs the app uses directly (the trailing-slash form redirects to them).
# Keep the redirects in step with src/redirects.ts and server.mjs. Netlify compresses on its own.
[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[[redirects]]
from = "/"
to = "/weekday/shacharit"
status = 302
force = true

[[redirects]]
from = "/roadmap.html"
to = "/weekday/shacharit"
status = 301
force = true

[[redirects]]
from = "/weekday-shacharit.html"
to = "/weekday/shacharit"
status = 301
force = true

[[redirects]]
from = "/about.html"
to = "/about"
status = 301
force = true

# Anything that is not a page or asset is not found (Netlify only applies this when no file matches).
[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/notes/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/texts/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Pages are revalidated on every visit, so a new build shows at once; Netlify sends a strong ETag
# and answers a matching If-None-Match with a 304, so an unchanged page costs only headers (as
# server.mjs does). Hashed assets above are cached for good.
[[headers]]
for = "/weekday/*"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/shabbat/*"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/about"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"
